<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forcing lab</title>
<style>
  /* Family look: the Pile lab's ground, glass and type. */
  :root {
    --ground-hi: #eef1f7; --ground-mid: #e5eaf3; --ground-lo: #d9dfeb;
    --glass: rgba(255,255,255,.72); --glass-edge: rgba(15,23,42,.10);
    --ink: #0f172a; --soft: #475569; --muted: #8a94a2;
    --accent: #2563eb; --sky: rgba(255,255,255,.55);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground-hi: #1a1f29; --ground-mid: #141922; --ground-lo: #0e1219;
      --glass: rgba(30,36,48,.72); --glass-edge: rgba(226,232,240,.10);
      --ink: #e2e8f0; --soft: #c3cbd6; --muted: #8b95a5;
      --accent: #60a5fa; --sky: rgba(148,163,184,.08);
    }
  }
  html, body { margin: 0; height: 100%; width: 100%; overflow: hidden; }
  body {
    background:
      radial-gradient(120% 85% at 50% -8%, var(--sky), rgba(255,255,255,0) 58%),
      radial-gradient(85% 65% at 50% 108%, rgba(37,99,235,.11), rgba(37,99,235,0) 72%),
      radial-gradient(140% 120% at 50% 50%, rgba(15,23,42,0) 55%, rgba(15,23,42,.07) 100%),
      linear-gradient(180deg, var(--ground-hi) 0%, var(--ground-mid) 46%, var(--ground-lo) 100%);
    background-color: var(--ground-mid);
    font: 500 13px/1.35 system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    color: var(--ink);
    -webkit-text-size-adjust: 100%;
  }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
  .glass {
    position: fixed; top: 12px; z-index: 2;
    background: var(--glass); border: 1px solid var(--glass-edge);
    border-radius: 11px; box-shadow: 0 1px 3px rgba(15,23,42,.08);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }
  .panel { left: 12px; padding: 8px 12px 6px; display: flex; flex-direction: column; gap: 6px; width: min(300px, 70vw); }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  label, .lbl { color: var(--soft); font-weight: 600; font-size: 13px; letter-spacing: .02em; }
  output { font-variant-numeric: tabular-nums; color: var(--ink); font-size: 15px; font-weight: 650; }
  input[type=range] { width: 100%; margin: 0; accent-color: var(--accent); height: 26px; }
  .seg { display: flex; gap: 0; border: 1px solid var(--glass-edge); border-radius: 8px; overflow: hidden; }
  .seg button {
    flex: 1; padding: 6px 10px; border: 0; background: transparent; cursor: pointer;
    font: 600 13px/1 system-ui, -apple-system, "Segoe UI", Arial, sans-serif; color: var(--soft);
    -webkit-tap-highlight-color: transparent;
  }
  .seg button[aria-pressed=true] { background: var(--accent); color: #fff; }
  .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
</style>
</head>
<body>
<canvas id="c" aria-label="A pile pushed by a periodic force. Choose sine or sawtooth and drag the fundamental frequency; the spectrum shows where the force's harmonics sit against the pile's natural frequency."></canvas>

<div class="glass panel">
  <div class="row"><span class="lbl">Waveform</span>
    <div class="seg" role="group" aria-label="Waveform">
      <button type="button" id="wSine" aria-pressed="false">Sine</button>
      <button type="button" id="wSaw" aria-pressed="true">Sawtooth</button>
    </div>
  </div>
  <div class="row"><label for="ff">Fundamental</label><output id="ffOut" for="ff"></output></div>
  <input type="range" id="ff" min="0.15" max="1.5" step="0.001" value="0.30">
</div>

<script>
/* ------------------------------------------------------- forcing engine
 *
 * Shared, character for character, by the Forcing lab and the Modes lab;
 * verify.mjs in each slices it out by its first line and the "state" banner.
 *
 * Everything is steady state, in units where f1 = 1. The force is periodic
 * with fundamental fF, so it is a sum of harmonics at n*fF; each harmonic
 * passes through a mode's transfer function on its own and the results add.
 * No time-stepping, so the display follows the slider at once.
 *
 * The sawtooth is softened: an ideal one drops instantly, and that drop taps
 * every mode of the pile into ringing at its own frequency, whatever fF is.
 * A real load never drops in zero time, so the ideal comb (heights 1/n) is
 * passed through a two-pole low-pass at EDGE_FC * f1. The harmonics that can
 * reach f1 are barely touched; those far above it fade smoothly, with no
 * notches. The sine is exactly the sawtooth's fundamental, so the sawtooth
 * only ever *adds* harmonics.
 */
const ZETA = 0.05;                   // display damping; the lab test's 0.017 makes peaks too narrow to find
const EDGE_FC = 3;                   // softening corner, in units of f1; 0 gives the ideal sawtooth

/** Complex amplitude [re, im] of each harmonic n = 1..N, the fundamental of
    magnitude 1, so that F(theta) = sum re*cos(n theta) - im*sin(n theta). */
function forcingCoeffs(waveform, fF, edgeFc, N) {
  const c = [];
  const M = waveform === 'sine' ? 1 : N;
  for (let n = 1; n <= M; n++) {
    let re = 0, im = 1 / n;          // ideal rising sawtooth: -sum sin(n theta)/n
    if (edgeFc > 0) {
      for (let p = 0; p < 2; p++) {  // divide by (1 + i n fF / fc), twice
        const b = (n * fF) / edgeFc, m = 1 + b * b;
        [re, im] = [(re + im * b) / m, (im - re * b) / m];
      }
    }
    c.push([re, im]);
  }
  const s = Math.hypot(c[0][0], c[0][1]);
  return c.map(([re, im]) => [re / s, im / s]);
}

/** Enough harmonics to pass three times the highest frequency of interest. */
function harmonicCount(waveform, fF, fTop) {
  return waveform === 'sine' ? 1 : Math.min(600, Math.ceil((3 * fTop) / fF));
}

/** A mode's response to a unit force at frequency ratio w, divided by its static response. */
function transfer(w, zeta) {
  const dr = 1 - w * w, di = 2 * zeta * w, m = dr * dr + di * di;
  return [dr / m, -di / m];
}

/** Value of the series at phase theta. */
function evalSeries(c, theta) {
  let x = 0;
  for (let n = 0; n < c.length; n++) {
    const p = (n + 1) * theta;
    x += c[n][0] * Math.cos(p) - c[n][1] * Math.sin(p);
  }
  return x;
}

/** Largest |value| over one period, sampled finely enough for the top harmonic. */
function seriesPeak(c) {
  let T = 256;
  while (T < 4 * c.length) T *= 2;
  const cs = new Float64Array(T), sn = new Float64Array(T);
  for (let k = 0; k < T; k++) { cs[k] = Math.cos((2 * Math.PI * k) / T); sn[k] = Math.sin((2 * Math.PI * k) / T); }
  let peak = 0;
  for (let k = 0; k < T; k++) {
    let x = 0;
    for (let n = 0; n < c.length; n++) {
      const j = ((n + 1) * k) % T;
      x += c[n][0] * cs[j] - c[n][1] * sn[j];
    }
    peak = Math.max(peak, Math.abs(x));
  }
  return peak;
}

/**
 * Steady-state motion of one mode with natural frequency ratio r = fj/f1,
 * driven by forcing coefficients c at fundamental fF. Normalised so the
 * static response to a force of fundamental amplitude 1 is 1: `peak` is then
 * the Amplification.
 */
function steadyState(c, fF, r, zeta) {
  const a = c.map(([re, im], i) => {
    const [hr, hi] = transfer(((i + 1) * fF) / r, zeta);
    return [re * hr - im * hi, re * hi + im * hr];
  });
  return { coeffs: a, peak: seriesPeak(a) };
}

/* --------------------------------------------------------------- state */

const params = new URLSearchParams(location.search);
const edgeParam = parseFloat(params.get('edge'));
const EDGE = Number.isFinite(edgeParam) && edgeParam >= 0 ? edgeParam : EDGE_FC;

const SPEC_MAX = 5;                  // spectrum axis, in f/f1
let waveform = 'saw';
let fF = 0.30;
let forcing = null, resp = null, forcePeak = 1;
let shownAmp = 1;                    // the Amplification as drawn, easing to the true one
let theta = 0, clock = 0;

function recompute() {
  const N = harmonicCount(waveform === 'saw' ? 'saw' : 'sine', fF, SPEC_MAX);
  forcing = forcingCoeffs(waveform === 'saw' ? 'saw' : 'sine', fF, EDGE, N);
  forcePeak = seriesPeak(forcing);
  resp = steadyState(forcing, fF, 1, ZETA);
}

/* Mode 1 of a uniform clamped-free beam, unit at the top. Close enough to the
   Pile lab's shape with its Nacelle that nobody could tell them apart. */
const BETA1 = 1.875104068711961;
function mode1(x) {
  const b = BETA1, s = (Math.cosh(b) + Math.cos(b)) / (Math.sinh(b) + Math.sin(b));
  const f = (y) => Math.cosh(b * y) - Math.cos(b * y) - s * (Math.sinh(b * y) - Math.sin(b * y));
  return f(x) / f(1);
}
const SAMPLES = 48;
const SHAPE = Array.from({ length: SAMPLES + 1 }, (_, i) => mode1(i / SAMPLES));

const TRACE_SECONDS = 5, TRACE_HZ = 60, TRACE_N = TRACE_SECONDS * TRACE_HZ;
const trace = new Float32Array(TRACE_N);
let traceHead = 0, traceCount = 0, traceAcc = 0;

/* ------------------------------------------------------------ rendering */

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, lay = null;

function readPalette() {
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  return dark ? {
    pile: '#cbd5e1', pileLo: '#94a3b8', shadow: 'rgba(0,0,0,0.35)', seam: 'rgba(255,255,255,0.18)',
    accent: '96,165,250', warm: '251,146,60', ink: '#e2e8f0', muted: 'rgba(148,163,184,0.85)',
    rule: 'rgba(148,163,184,0.28)', soil: '71,85,105', nacelleHi: '#e2e8f0', nacelleLo: '#64748b',
  } : {
    pile: '#1f2937', pileLo: '#4b5563', shadow: 'rgba(15,23,42,0.16)', seam: 'rgba(255,255,255,0.30)',
    accent: '37,99,235', warm: '234,88,12', ink: '#0f172a', muted: 'rgba(71,85,105,0.9)',
    rule: 'rgba(100,116,139,0.30)', soil: '100,116,139', nacelleHi: '#64748b', nacelleLo: '#1e293b',
  };
}
let pal = readPalette();
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { pal = readPalette(); });
const rgba = (c, a) => `rgba(${c},${a.toFixed(3)})`;
const font = (w, px) => `${w} ${px}px system-ui,-apple-system,"Segoe UI",Arial,sans-serif`;

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = cv.clientWidth; H = cv.clientHeight;
  const bw = Math.round(W * DPR), bh = Math.round(H * DPR);
  if (cv.width !== bw || cv.height !== bh) { cv.width = bw; cv.height = bh; }
  layout();
}

/** Where everything sits, from the window size alone. */
function layout() {
  const top = 110, pad = 16;
  const fs = Math.max(12, Math.min(18, Math.min(W, H) / 38));
  const wide = W > H * 1.05;
  let stage, force, spec;
  if (wide) {
    const sw = W * 0.42;
    stage = { x: pad, y: top, w: sw - pad, h: H - top - pad };
    const rx = sw + pad, rw = W - rx - pad, rh = H - top - pad;
    force = { x: rx, y: top, w: rw, h: rh * 0.38 };
    spec = { x: rx, y: top + rh * 0.38 + pad, w: rw, h: rh * 0.62 - pad };
  } else {
    const avail = H - top - pad;
    stage = { x: pad, y: top, w: W - 2 * pad, h: avail * 0.46 };
    force = { x: pad, y: top + avail * 0.46 + pad / 2, w: W - 2 * pad, h: avail * 0.2 };
    spec = { x: pad, y: force.y + force.h + pad / 2, w: W - 2 * pad, h: avail * 0.34 - pad };
  }
  // The pile and its Amplification bar share the stage.
  const barW = Math.max(26, Math.min(44, stage.w * 0.09));
  const baseY = stage.y + stage.h - 20;
  const scale = Math.max(40, Math.min(stage.h - 70, stage.w * 0.75));
  const cx = stage.x + (stage.w - barW - 80) * 0.45;
  const bar = { x: stage.x + stage.w - barW - 10, y: baseY - scale, w: barW, h: scale };
  lay = { fs, stage, force, spec, baseY, scale, cx, bar, pileW: Math.max(5, Math.min(14, scale * 0.028)) };
}

const AMP_PER_UNIT = 0.022;          // top displacement, in pile lengths, per unit of Amplification
const BAR_MAX = 12;

function drawGround() {
  const { baseY, cx, scale, pileW } = lay;
  const half = scale * 0.5;
  const g = ctx.createLinearGradient(0, baseY, 0, baseY + 20);
  g.addColorStop(0, rgba(pal.soil, 0.22)); g.addColorStop(1, rgba(pal.soil, 0));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(cx, baseY, half, 20, 0, 0, Math.PI); ctx.fill();
  ctx.lineCap = 'butt';
  ctx.strokeStyle = rgba(pal.soil, 0.35); ctx.lineWidth = pileW;
  ctx.beginPath(); ctx.moveTo(cx, baseY); ctx.lineTo(cx, baseY + 14); ctx.stroke();
  const m = ctx.createLinearGradient(cx - half, 0, cx + half, 0);
  m.addColorStop(0, rgba(pal.soil, 0)); m.addColorStop(0.5, rgba(pal.soil, 0.55)); m.addColorStop(1, rgba(pal.soil, 0));
  ctx.strokeStyle = m; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(cx - half, baseY + 0.5); ctx.lineTo(cx + half, baseY + 0.5); ctx.stroke();
}

function strokePile(top, width, style) {
  ctx.lineWidth = width; ctx.strokeStyle = style;
  ctx.beginPath();
  for (let i = 0; i <= SAMPLES; i++) {
    const x = lay.cx + SHAPE[i] * top * lay.scale, y = lay.baseY - (i / SAMPLES) * lay.scale;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
}

function drawPile(top, force) {
  const w = lay.pileW;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  // The envelope of the swing, faintly, so a still pile and a big swing read at a glance.
  ctx.fillStyle = rgba(pal.accent, 0.08);
  ctx.beginPath();
  const env = shownAmp * AMP_PER_UNIT;
  for (let i = 0; i <= SAMPLES; i++) ctx.lineTo(lay.cx + SHAPE[i] * env * lay.scale, lay.baseY - (i / SAMPLES) * lay.scale);
  for (let i = SAMPLES; i >= 0; i--) ctx.lineTo(lay.cx - SHAPE[i] * env * lay.scale, lay.baseY - (i / SAMPLES) * lay.scale);
  ctx.fill();
  strokePile(top, w * 1.9, pal.shadow);
  const g = ctx.createLinearGradient(0, lay.baseY, 0, lay.baseY - lay.scale);
  g.addColorStop(0, pal.pileLo); g.addColorStop(0.5, pal.pile); g.addColorStop(1, pal.pile);
  strokePile(top, w, g);
  strokePile(top, Math.max(0.6, w * 0.22), pal.seam);

  // Nacelle, as in the Pile lab at its default weight.
  const x = lay.cx + top * lay.scale, y = lay.baseY - lay.scale;
  const slope = top * 1.377;           // mode 1's slope at the top, per unit top displacement
  const nw = lay.scale * (0.07 + 0.1 * Math.sqrt(1 / 3)), nh = nw * 0.42;
  ctx.save();
  ctx.translate(x, y); ctx.rotate(Math.atan(slope)); ctx.translate(0, -nh * 0.5);
  ctx.fillStyle = pal.shadow;
  ctx.beginPath(); ctx.ellipse(0, nh * 0.62, nw * 0.62, nh * 0.32, 0, 0, Math.PI * 2); ctx.fill();
  const ng = ctx.createLinearGradient(0, -nh / 2, 0, nh / 2);
  ng.addColorStop(0, pal.nacelleHi); ng.addColorStop(1, pal.nacelleLo);
  ctx.fillStyle = ng;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(-nw / 2, -nh / 2, nw, nh, nh * 0.42); else ctx.rect(-nw / 2, -nh / 2, nw, nh);
  ctx.fill();
  ctx.beginPath(); ctx.ellipse(-nw / 2, 0, nh * 0.34, nh * 0.42, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // The force: an arrow at the top whose length follows it.
  const ay = lay.baseY - lay.scale * 0.93, len = force * lay.scale * 0.09;
  const ax = lay.cx + SHAPE[Math.round(0.93 * SAMPLES)] * top * lay.scale - 14;
  if (Math.abs(len) > 2) {
    ctx.strokeStyle = rgba(pal.warm, 0.9); ctx.fillStyle = rgba(pal.warm, 0.9); ctx.lineWidth = 3; ctx.lineCap = 'round';
    const tail = ax - Math.abs(len) - 4, dir = Math.sign(len);
    const from = dir > 0 ? tail : ax - 4, to = dir > 0 ? ax : tail;
    ctx.beginPath(); ctx.moveTo(from, ay); ctx.lineTo(to, ay); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(to, ay); ctx.lineTo(to - dir * 9, ay - 6); ctx.lineTo(to - dir * 9, ay + 6); ctx.closePath(); ctx.fill();
  }
}

function drawBar() {
  const { bar, fs } = lay;
  const yOf = (v) => bar.y + bar.h * (1 - Math.min(v, BAR_MAX) / BAR_MAX);
  ctx.fillStyle = rgba(pal.accent, 0.10);
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(bar.x, bar.y, bar.w, bar.h, 6) : ctx.rect(bar.x, bar.y, bar.w, bar.h); ctx.fill();
  const v = shownAmp, y = yOf(v);
  const g = ctx.createLinearGradient(0, bar.y + bar.h, 0, bar.y);
  g.addColorStop(0, rgba(pal.accent, 0.55)); g.addColorStop(1, rgba(pal.warm, 0.9));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(bar.x, y, bar.w, bar.y + bar.h - y, 6) : ctx.rect(bar.x, y, bar.w, bar.y + bar.h - y); ctx.fill();
  // The static mark.
  const ys = Math.round(yOf(1)) + 0.5;
  ctx.strokeStyle = pal.ink; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(bar.x - 6, ys); ctx.lineTo(bar.x + bar.w + 6, ys); ctx.stroke();
  ctx.fillStyle = pal.muted; ctx.font = font(500, fs * 0.8); ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  ctx.fillText('static', bar.x - 9, ys);
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.fillStyle = pal.ink; ctx.font = font(700, fs * 1.6);
  ctx.fillText('×' + v.toFixed(1), bar.x + bar.w / 2, bar.y - fs * 1.3);
  ctx.fillStyle = pal.muted; ctx.font = font(600, fs * 0.75);
  ctx.fillText('AMPLIFICATION', bar.x + bar.w / 2, bar.y - 4);
}

function paneTitle(p, text) {
  ctx.fillStyle = pal.muted; ctx.font = font(650, lay.fs * 0.8);
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText(text, p.x, p.y);
}

function drawForce() {
  const p = lay.force, fs = lay.fs;
  paneTitle(p, 'FORCE  ·  last ' + TRACE_SECONDS + ' s');
  const y0 = p.y + fs * 1.4, h = p.h - fs * 1.6, mid = y0 + h / 2, amp = h * 0.45;
  ctx.strokeStyle = rgba(pal.accent, 0.18); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(p.x, Math.round(mid) + 0.5); ctx.lineTo(p.x + p.w, Math.round(mid) + 0.5); ctx.stroke();
  const n = traceCount, px = p.w / (TRACE_N - 1);
  if (n < 2) return;
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const v = trace[(traceHead - n + i + TRACE_N) % TRACE_N];
    const x = p.x + p.w - (n - 1 - i) * px, y = mid - (v / forcePeak) * amp;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.strokeStyle = rgba(pal.warm, 0.18); ctx.lineWidth = 6; ctx.stroke();
  ctx.strokeStyle = rgba(pal.warm, 0.95); ctx.lineWidth = 2.2; ctx.stroke();
}

function drawSpectrum() {
  const p = lay.spec, fs = lay.fs;
  paneTitle(p, 'FORCE SPECTRUM');
  const x0 = p.x + 8, x1 = p.x + p.w - 8, yb = p.y + p.h - fs * 1.8, yt = p.y + fs * 2.4;
  const xOf = (f) => x0 + ((x1 - x0) * f) / SPEC_MAX;
  // Axis.
  ctx.strokeStyle = pal.rule; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x0, Math.round(yb) + 0.5); ctx.lineTo(x1, Math.round(yb) + 0.5); ctx.stroke();
  ctx.fillStyle = pal.muted; ctx.font = font(500, fs * 0.8); ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (let k = 0; k <= SPEC_MAX; k++) {
    const x = Math.round(xOf(k)) + 0.5;
    ctx.beginPath(); ctx.moveTo(x, yb); ctx.lineTo(x, yb + 5); ctx.stroke();
    ctx.fillText(String(k), x, yb + 7);
  }
  ctx.textAlign = 'right';
  ctx.fillText('f / f₁', x1, yb + 7 + fs);
  // f1 line.
  const xf = Math.round(xOf(1)) + 0.5;
  ctx.setLineDash([5, 5]); ctx.strokeStyle = rgba(pal.warm, 0.8); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(xf, yb); ctx.lineTo(xf, yt - fs * 0.6); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = rgba(pal.warm, 1); ctx.font = font(700, fs); ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.fillText('f₁', xf, yt - fs * 0.7);
  // The comb. A harmonic inside the resonance peak is drawn hot.
  const h = yb - yt;
  for (let i = 0; i < forcing.length; i++) {
    const f = (i + 1) * fF;
    if (f > SPEC_MAX) break;
    const a = Math.hypot(forcing[i][0], forcing[i][1]);
    const x = xOf(f), hot = Math.abs(f - 1) < 1.5 * ZETA;
    const top = yb - a * h;
    ctx.lineCap = 'round';
    if (hot) { ctx.strokeStyle = rgba(pal.warm, 0.25); ctx.lineWidth = 12; ctx.beginPath(); ctx.moveTo(x, yb); ctx.lineTo(x, top); ctx.stroke(); }
    ctx.strokeStyle = hot ? rgba(pal.warm, 1) : rgba(pal.accent, 0.9); ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(x, yb); ctx.lineTo(x, top); ctx.stroke();
    ctx.fillStyle = ctx.strokeStyle; ctx.beginPath(); ctx.arc(x, top, 4, 0, Math.PI * 2); ctx.fill();
  }
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  // Normalised steady-state shape, scaled to the eased Amplification.
  const norm = resp.peak > 0 ? evalSeries(resp.coeffs, theta) / resp.peak : 0;
  const top = norm * shownAmp * AMP_PER_UNIT;
  const force = evalSeries(forcing, theta) / forcePeak;
  drawGround();
  drawPile(top, force);
  drawBar();
  drawForce();
  drawSpectrum();
}

/* ------------------------------------------------------------- controls */

const ffIn = document.getElementById('ff'), ffOut = document.getElementById('ffOut');
const bSine = document.getElementById('wSine'), bSaw = document.getElementById('wSaw');
function showControls() {
  ffOut.textContent = fF.toFixed(2) + ' f₁';
  bSine.setAttribute('aria-pressed', String(waveform === 'sine'));
  bSaw.setAttribute('aria-pressed', String(waveform === 'saw'));
}
ffIn.addEventListener('input', () => { fF = parseFloat(ffIn.value); recompute(); showControls(); });
bSine.addEventListener('click', () => { waveform = 'sine'; recompute(); showControls(); });
bSaw.addEventListener('click', () => { waveform = 'saw'; recompute(); showControls(); });

/* ----------------------------------------------------------------- loop */

const EASE_S = 0.45;                 // the pile wakes up or settles over about this long
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now; clock += dt;
  theta = (theta + 2 * Math.PI * fF * dt) % (2 * Math.PI);   // f1 swings once a second on screen
  shownAmp += (resp.peak - shownAmp) * Math.min(1, dt / EASE_S * 2.2);
  traceAcc += dt * TRACE_HZ;
  while (traceAcc >= 1) {
    traceAcc -= 1;
    trace[traceHead] = evalSeries(forcing, theta);
    traceHead = (traceHead + 1) % TRACE_N;
    traceCount = Math.min(TRACE_N, traceCount + 1);
  }
  render();
  requestAnimationFrame(frame);
}

recompute();
shownAmp = resp.peak;
showControls();
new ResizeObserver(resize).observe(cv);
resize();
requestAnimationFrame(frame);
</script>
</body>
