<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sea lab 3D</title>
<style>
  :root {
    --ground-hi: #eef1f7; --ground-mid: #e5eaf3; --ground-lo: #d9dfeb;
    --glass: rgba(255,255,255,.72); --glass-edge: rgba(15,23,42,.10);
    --ink: #0f172a; --soft: #475569; --muted: #8a94a2;
    --accent: #2563eb; --sky: rgba(255,255,255,.55);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground-hi: #1a1f29; --ground-mid: #141922; --ground-lo: #0e1219;
      --glass: rgba(30,36,48,.72); --glass-edge: rgba(226,232,240,.10);
      --ink: #e2e8f0; --soft: #c3cbd6; --muted: #8b95a5;
      --accent: #60a5fa; --sky: rgba(148,163,184,.08);
    }
  }
  html, body { margin: 0; height: 100%; width: 100%; overflow: hidden; }
  /* The same ground as the Pile lab, so the tools read as one family. */
  body {
    background:
      radial-gradient(120% 85% at 50% -8%, var(--sky), rgba(255,255,255,0) 58%),
      radial-gradient(140% 120% at 50% 50%, rgba(15,23,42,0) 55%, rgba(15,23,42,.07) 100%),
      linear-gradient(180deg, var(--ground-hi) 0%, var(--ground-mid) 46%, var(--ground-lo) 100%);
    background-color: var(--ground-mid);
    font: 500 13px/1.35 system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    color: var(--ink);
    -webkit-text-size-adjust: 100%;
  }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
  /* The WebGL sea sits under the 2D canvas, in the top band only. */
  #sea { bottom: auto; pointer-events: none; }

  /* The only chrome: gamma, and a fresh set of random phases. Hs and Tp live
     on the spectrum's peak. */
  .glass {
    position: fixed; top: 12px; z-index: 2;
    background: var(--glass); border: 1px solid var(--glass-edge);
    border-radius: 11px; box-shadow: 0 1px 3px rgba(15,23,42,.08);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }
  #shape { left: 12px; padding: 7px 11px 4px; display: flex; flex-direction: column; gap: 1px; width: min(230px, 52vw); }
  #shape .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  #shape label { color: var(--soft); font-weight: 600; font-size: 12px; letter-spacing: .02em; }
  #shape output { font-variant-numeric: tabular-nums; color: var(--ink); font-size: 12px; }
  #shape input { width: 100%; margin: 2px 0 0; accent-color: var(--accent); height: 22px; }
  /* Notches under the slider. A range thumb is ~16px wide, so a value's
     centre sits at p * (100% - 16px) + 8px, not at p * 100%. */
  .notches { position: relative; height: 13px; }
  .notch {
    position: absolute; top: 0; transform: translateX(-50%);
    font-size: 10px; color: var(--muted); white-space: nowrap; letter-spacing: .02em;
  }
  .notch::before {
    content: ""; position: absolute; left: 50%; top: -5px; width: 1px; height: 4px; background: var(--muted);
  }
  .notch.first { transform: none; }
  .notch.first::before { left: 0; }
  #newsea {
    right: 12px; height: 34px; padding: 0 14px; cursor: pointer;
    font: 600 12px/1 system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    color: var(--soft); letter-spacing: .03em;
    -webkit-tap-highlight-color: transparent;
  }
  #newsea:hover, #newsea:focus-visible { color: var(--ink); }
  #newsea:focus-visible, #shape input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #hint {
    position: fixed; right: 16px; z-index: 1;
    font: 500 clamp(10px, 1.2vw, 12px)/1.4 system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    letter-spacing: .02em; color: var(--muted); white-space: nowrap; pointer-events: none;
    opacity: 0; transition: opacity .7s ease; user-select: none;
  }
  #hint.show { opacity: 1; }
  #hint b { font-weight: 700; color: var(--soft); }
  @media (prefers-reduced-motion: reduce) { #hint { transition: none; } }
</style>
</head>
<body>
<canvas id="sea" aria-hidden="true"></canvas>
<canvas id="c" aria-label="A slab of irregular sea seen in perspective, the surface elevation at a probe over time, and the JONSWAP spectrum. Drag the spectrum's peak to change Hs and Tp."></canvas>

<div id="shape" class="glass">
  <div class="row"><label for="gamma">Peak enhancement γ</label><output id="gammaOut" for="gamma"></output></div>
  <input type="range" id="gamma" min="1" max="7" step="0.1" value="3.3">
  <div class="notches" aria-hidden="true">
    <span class="notch first" style="left: 0" title="Pierson–Moskowitz: a fully developed sea">P–M</span>
    <span class="notch" style="left: calc(0.3833 * (100% - 16px) + 8px)">North Sea</span>
  </div>
</div>
<button id="newsea" class="glass" type="button">New sea</button>
<div id="hint"><b>Drag</b> the spectrum's peak · slide <b>γ</b></div>

<script>
/* ---------------------------------------------------------------- physics
 *
 * A long-crested irregular sea in deep water: a sum of linear waves whose
 * amplitudes come from a JONSWAP spectrum and whose phases are random.
 *
 * The spectrum is the Hs-normalised form (as in DNV-RP-C205): its area is
 * exactly Hs^2/16 for every gamma, so gamma changes the spectrum's shape and
 * never the energy in the sea. The usual 1 - 0.287 ln(gamma) factor is only an
 * approximation of that, so the normalisation is computed instead.
 *
 * verify.mjs slices this section out by its first line and the "state" banner
 * below, and checks it against theory. Keep both markers.
 */
const G = 9.81;
const HS_RANGE = [0.5, 12];                 // m
const TP_RANGE = [4, 16];                   // s
const STEEPNESS_LIMIT = 1 / 15;             // Hs over the peak wavelength; steeper seas break
const N_WAVES = 256;                        // components in the sum
const NU_LO = 0.55, NU_HI = 4.0;            // their frequencies, as multiples of the peak's

/** Unnormalised JONSWAP shape at nu = f / fp. */
function shape(nu, gamma) {
  if (nu <= 0) return 0;
  const sigma = nu <= 1 ? 0.07 : 0.09;
  const r = Math.exp(-((nu - 1) ** 2) / (2 * sigma * sigma));
  return nu ** -5 * Math.exp(-1.25 * nu ** -4) * gamma ** r;
}

/** The constant that makes the area Hs^2/16, integrated once per gamma. */
const normCache = new Map();
function norm(gamma) {
  const key = Math.round(gamma * 1e4);
  let c = normCache.get(key);
  if (c === undefined) {
    // Simpson on [0.2, 10]; below 0.2 the shape is below 1e-300, above 10 it
    // is nu^-5 to within 1e-4, whose tail integral is 10^-4 / 4.
    const a = 0.2, b = 10, n = 19600, h = (b - a) / n;
    let s = shape(a, gamma) + shape(b, gamma);
    for (let i = 1; i < n; i++) s += (i % 2 ? 4 : 2) * shape(a + i * h, gamma);
    const integral = (s * h) / 3 + 1e-4 / 4;
    c = 1 / (16 * integral);
    normCache.set(key, c);
  }
  return c;
}

/** JONSWAP S(f) in m^2/Hz. */
function spectrum(f, hs, tp, gamma) {
  return hs * hs * tp * norm(gamma) * shape(f * tp, gamma);
}

/** The largest Hs that does not break at this Tp: Hs / lambda_p = 1/15. */
function hsLimit(tp) { return (STEEPNESS_LIMIT * G * tp * tp) / (2 * Math.PI); }

/** Keep a sea state inside the ranges and below the breaking limit. */
function clampSeaState(hs, tp) {
  const t = Math.min(TP_RANGE[1], Math.max(TP_RANGE[0], tp));
  const h = Math.min(HS_RANGE[1], hsLimit(t), Math.max(HS_RANGE[0], hs));
  return { hs: h, tp: t };
}

/** A small seeded generator, so the same seed gives the same sea. */
function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/**
 * One Sea: a fixed set of random phases, re-tuned whenever the spectrum
 * changes. Each component's phase advances by its own frequency and is
 * integrated rather than computed as omega*t, so a change of Tp alters how
 * fast each wave travels from now on without teleporting it: the sea being
 * watched morphs into the new one instead of being replaced.
 *
 * Frequencies sit at random points inside equal bins, so no two are in
 * simple ratio and the sea never visibly repeats.
 */
function createSea(seed) {
  const rand = mulberry32(seed);
  const jitter = new Float64Array(N_WAVES).map(() => rand());
  const phases = new Float64Array(N_WAVES);
  const theta = new Float64Array(N_WAVES);  // accumulated omega * t
  const f = new Float64Array(N_WAVES), w = new Float64Array(N_WAVES);
  const k = new Float64Array(N_WAVES), amp = new Float64Array(N_WAVES);
  const arg = new Float64Array(N_WAVES);
  let roll = mulberry32(seed * 7919 + 1);

  function newPhases() { for (let i = 0; i < N_WAVES; i++) phases[i] = 2 * Math.PI * roll(); }
  newPhases();

  return {
    get phases() { return phases; },
    get amplitudes() { return amp; },
    get frequencies() { return f; },

    setState(hs, tp, gamma) {
      const dnu = (NU_HI - NU_LO) / N_WAVES;
      for (let i = 0; i < N_WAVES; i++) {
        const nu = NU_LO + (i + jitter[i]) * dnu;
        f[i] = nu / tp;
        w[i] = 2 * Math.PI * f[i];
        k[i] = (w[i] * w[i]) / G;             // deep water
        amp[i] = Math.sqrt(2 * spectrum(f[i], hs, tp, gamma) * (dnu / tp));
      }
    },

    advance(dt) { for (let i = 0; i < N_WAVES; i++) theta[i] += w[i] * dt; },

    /** Surface elevation at x (m); waves travel towards +x. */
    eta(x) {
      let s = 0;
      for (let i = 0; i < N_WAVES; i++) s += amp[i] * Math.cos(k[i] * x - theta[i] + phases[i]);
      return s;
    },

    /** The whole surface at once: one pass per component, not per point. */
    surface(xs, out, kMax = Infinity) {
      out.fill(0);
      for (let i = 0; i < N_WAVES; i++) {
        const a = amp[i];
        if (a < 1e-5 || k[i] > kMax) continue;
        const ki = k[i], c = phases[i] - theta[i];
        for (let j = 0; j < xs.length; j++) out[j] += a * Math.cos(ki * xs[j] + c);
      }
      return out;
    },

    newSea() { newPhases(); },
  };
}

/* --------------------------------------------------------------- state */

let hs = 4, tp = 10, gamma = 3.3;
let seed = 1;
const sea = createSea(seed);
sea.setState(hs, tp, gamma);

// The sea runs faster than real time, and the panels say so, so nobody
// reads a period off it as if it were real time.
const SPEED = 15;                          // a 3-4 minute exercise needs changes to show within seconds

const TRACE_SECONDS = 180;                  // long enough to hold several wave groups
const TRACE_HZ = 10;
const TRACE_N = TRACE_SECONDS * TRACE_HZ;
const trace = new Float32Array(TRACE_N);
let traceCount = 0, traceHead = 0, traceTotal = 0, traceClock = 0;

/* ------------------------------------------------------------ rendering */

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, lay = null;

function readPalette() {
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  return dark ? {
    accent: '96,165,250', ink: '#e2e8f0', muted: 'rgba(148,163,184,0.8)', rule: 'rgba(148,163,184,0.22)',
    warm: '251,146,60', core: 'rgba(191,219,254,0.95)',
    gl: { deep: [0.03, 0.12, 0.33], shallow: [0.22, 0.52, 0.92], sky: [0.55, 0.68, 0.9], bg: [0.08, 0.1, 0.13],
          sideTop: [0.12, 0.33, 0.72], sideBot: [0.02, 0.05, 0.14] },
  } : {
    accent: '37,99,235', ink: '#0f172a', muted: 'rgba(100,116,139,0.9)', rule: 'rgba(100,116,139,0.25)',
    warm: '234,88,12', core: 'rgba(219,234,254,0.95)',
    gl: { deep: [0.05, 0.2, 0.5], shallow: [0.36, 0.64, 0.98], sky: [0.93, 0.96, 1.0], bg: [0.9, 0.92, 0.95],
          sideTop: [0.2, 0.45, 0.9], sideBot: [0.04, 0.11, 0.32] },
  };
}
let pal = readPalette();
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { pal = readPalette(); });
const rgba = (c, a) => `rgba(${c},${Math.max(0, a).toFixed(3)})`;
const FONT = 'system-ui,-apple-system,"Segoe UI",Arial,sans-serif';

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = cv.clientWidth; H = cv.clientHeight;
  const bw = Math.round(W * DPR), bh = Math.round(H * DPR);
  if (cv.width !== bw || cv.height !== bh) { cv.width = bw; cv.height = bh; }
  layout();
}

/** Three bands: the sea block, the trace, the spectrum. */
function layout() {
  const seaH = Math.round(H * 0.46);
  const traceH = Math.round(H * 0.2);
  const specTop = seaH + traceH;
  lay = { seaH, traceTop: seaH, traceH, specTop, specH: H - specTop };
  gcv.style.height = seaH + 'px';
  const bw = Math.round(W * DPR), bh = Math.round(seaH * DPR);
  if (gcv.width !== bw || gcv.height !== bh) { gcv.width = bw; gcv.height = bh; }
  fitBlock(W, seaH);
  // Hint at the top right of the spectrum, where the hand will go, clear of
  // the plot's own label on the left.
  hint.style.top = (specTop + 7) + 'px';
}

/* -------------------------------------------------------------- the block
 * The sea as a slab, seen isometrically from above and to the front-left:
 * a lit, glossy top surface and a cut-away front face whose top edge is the
 * wave profile. The sea is long-crested, so the surface only varies along x
 * (the direction the waves travel); across the slab every crest is a
 * straight line. No turbine: the Probe is a marker on the front edge.
 *
 * Heights are exaggerated EXAG times, and the panel says so. Without it a
 * 4 m sea on 1.6 km of water is a few pixels thick, and the point of this
 * view is to see wave groups at a glance.
 */
const SPAN = 1600;                          // m along the direction of travel
const WIDTH = 700;                          // m across, along the crests
const EXAG = 7;                            // heights drawn this many times larger
const BASE = -60;                           // bottom of the slab, in drawn metres
const NX = 1024;
const DX = SPAN / NX;
const K_MAX = Math.PI / (2 * DX);           // shortest wave drawn: four samples a wavelength
const AZ = 16 * Math.PI / 180, EL = 42 * Math.PI / 180;
const EYE = [-Math.sin(AZ) * Math.cos(EL), -Math.cos(AZ) * Math.cos(EL), Math.sin(EL)];
const blockXs = Float64Array.from({ length: NX + 1 }, (_, i) => -SPAN / 2 + i * DX);
const blockZ = new Float64Array(NX + 1);
const blockSmooth = new Float64Array(NX + 1);

/* A few 4x4 matrices, column-major as WebGL wants them. */
function mat4Mul(a, b) {
  const o = new Float32Array(16);
  for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
    let s = 0;
    for (let k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k];
    o[c * 4 + r] = s;
  }
  return o;
}
function lookAt(eye, up) {
  const f = eye.map((v) => -v), n = Math.hypot(...f); const F = f.map((v) => v / n);
  let S = [F[1] * up[2] - F[2] * up[1], F[2] * up[0] - F[0] * up[2], F[0] * up[1] - F[1] * up[0]];
  const sn = Math.hypot(...S); S = S.map((v) => v / sn);
  const U = [S[1] * F[2] - S[2] * F[1], S[2] * F[0] - S[0] * F[2], S[0] * F[1] - S[1] * F[0]];
  const e = eye;
  return new Float32Array([
    S[0], U[0], -F[0], 0, S[1], U[1], -F[1], 0, S[2], U[2], -F[2], 0,
    -(S[0] * e[0] + S[1] * e[1] + S[2] * e[2]), -(U[0] * e[0] + U[1] * e[1] + U[2] * e[2]), F[0] * e[0] + F[1] * e[1] + F[2] * e[2], 1,
  ]);
}
function ortho(l, r, b, t, n, f) {
  return new Float32Array([2 / (r - l), 0, 0, 0, 0, 2 / (t - b), 0, 0, 0, 0, -2 / (f - n), 0,
    -(r + l) / (r - l), -(t + b) / (t - b), -(f + n) / (f - n), 1]);
}
function apply(m, x, y, z) {
  return [m[0] * x + m[4] * y + m[8] * z + m[12], m[1] * x + m[5] * y + m[9] * z + m[13], m[2] * x + m[6] * y + m[10] * z + m[14]];
}

const VIEW = lookAt(EYE.map((v) => v * 2000), [0, 0, 1]);
let MVP = null;                             // set by fitBlock()

/**
 * Frame the slab in the panel. The whole block fits if it can; on a narrow
 * screen the ends are cropped rather than shrinking the waves to nothing.
 */
function fitBlock(w, h) {
  const zTop = 12 * 1.3 * EXAG;
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity, z0 = Infinity, z1 = -Infinity;
  for (const x of [-SPAN / 2, SPAN / 2]) for (const y of [-WIDTH / 2, WIDTH / 2]) for (const z of [BASE, zTop]) {
    const p = apply(VIEW, x, y, z);
    x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]);
    z0 = Math.min(z0, p[2]); z1 = Math.max(z1, p[2]);
  }
  const padX = 0.03 * (x1 - x0), padY = 0.06 * (y1 - y0);
  const byW = w / (x1 - x0 + 2 * padX), byH = h / (y1 - y0 + 2 * padY);
  const scale = Math.min(byH, Math.max(byW, 0.62 * byH));   // px per drawn metre
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2 - 0.02 * (y1 - y0);
  const hw = w / 2 / scale, hh = h / 2 / scale;
  MVP = mat4Mul(ortho(cx - hw, cx + hw, cy - hh, cy + hh, -z1 - 100, -z0 + 100), VIEW);
  blockPx = scale;
}
let blockPx = 1;

/** World point to CSS pixels in the sea panel. */
function project(x, y, z) {
  const p = apply(MVP, x, y, z);
  return [(p[0] + 1) / 2 * W, (1 - p[1]) / 2 * lay.seaH];
}

/* ---- WebGL. If it is not there, the 2D overlay still draws the profile. */
const gcv = document.getElementById('sea');
const gl = (() => {
  try { return gcv.getContext('webgl', { antialias: true, alpha: true, premultipliedAlpha: false }); } catch { return null; }
})();
let glp = null;

const VS = `
attribute vec3 aPos; attribute vec3 aNor;
uniform mat4 uMVP;
varying vec3 vP; varying vec3 vN;
void main() { vP = aPos; vN = aNor; gl_Position = uMVP * vec4(aPos, 1.0); }`;
const FS = `
precision mediump float;
varying vec3 vP; varying vec3 vN;
uniform float uMode, uCrest, uBase, uHalfW;
uniform vec3 uSun, uView, uDeep, uShallow, uSky, uBg, uSideTop, uSideBot;
void main() {
  if (uMode > 0.5) {
    // Cut-away face: light near the surface, darkening with depth.
    float t = clamp((vP.z - uBase) / (-uBase), 0.0, 1.0);
    gl_FragColor = vec4(mix(uSideBot, uSideTop, t * t), 1.0);
    return;
  }
  vec3 N = normalize(vN), L = normalize(uSun), V = normalize(uView);
  float diff = max(dot(N, L), 0.0);
  float spec = pow(max(dot(N, normalize(L + V)), 0.0), 60.0);
  float fres = pow(1.0 - max(dot(N, V), 0.0), 4.0);
  // Colour says height, so a group reads as a run of bright crests and dark
  // troughs and a lull as flat mid-tone; light adds gloss on top.
  float h = clamp(vP.z / uCrest * 0.55 + 0.5, 0.0, 1.0);
  h = h * h * (3.0 - 2.0 * h);
  vec3 c = mix(uDeep, uShallow, h) * (0.7 + 0.35 * diff) + uSky * fres * 0.45 + vec3(0.9) * spec * 0.8;
  float far = clamp((vP.y + uHalfW) / (2.0 * uHalfW), 0.0, 1.0);   // haze towards the back
  gl_FragColor = vec4(mix(c, uBg, far * 0.3), 1.0);
}`;

function initGl() {
  if (!gl) return;
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return;
  const u = (n) => gl.getUniformLocation(prog, n);
  glp = {
    prog, aPos: gl.getAttribLocation(prog, 'aPos'), aNor: gl.getAttribLocation(prog, 'aNor'),
    uMVP: u('uMVP'), uMode: u('uMode'), uCrest: u('uCrest'), uBase: u('uBase'), uHalfW: u('uHalfW'),
    uSun: u('uSun'), uView: u('uView'), uDeep: u('uDeep'), uShallow: u('uShallow'), uSky: u('uSky'),
    uBg: u('uBg'), uSideTop: u('uSideTop'), uSideBot: u('uSideBot'),
    top: gl.createBuffer(), front: gl.createBuffer(), end: gl.createBuffer(),
    topData: new Float32Array((NX + 1) * 2 * 6), frontData: new Float32Array((NX + 1) * 2 * 6),
    endData: new Float32Array(4 * 6),
  };
}

function strip(buf, data, n) {
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, data, gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(glp.aPos);
  gl.vertexAttribPointer(glp.aPos, 3, gl.FLOAT, false, 24, 0);
  gl.enableVertexAttribArray(glp.aNor);
  gl.vertexAttribPointer(glp.aNor, 3, gl.FLOAT, false, 24, 12);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, n);
}

function drawGl() {
  if (!glp || gl.isContextLost()) return;
  const z = blockZ, hw = WIDTH / 2;
  const T = glp.topData, Fr = glp.frontData, E = glp.endData;
  // Normals come from the surface smoothed over an eighth of the peak
  // wavelength. Short waves are the steepest, so unsmoothed they dominate the
  // gloss and the slab reads as a barcode; smoothed, the gloss follows the
  // waves that carry the energy - which is where the groups are.
  const half = Math.max(1, Math.round((G * tp * tp) / (2 * Math.PI) / 16 / DX));
  for (let i = 0; i <= NX; i++) {
    let acc = 0, cnt = 0;
    for (let j = Math.max(0, i - half); j <= Math.min(NX, i + half); j++) { acc += z[j]; cnt++; }
    blockSmooth[i] = acc / cnt;
  }
  for (let i = 0; i <= NX; i++) {
    const zl = blockSmooth[Math.max(0, i - 1)], zr = blockSmooth[Math.min(NX, i + 1)];
    const sx = -(zr - zl) / (2 * DX), n = Math.hypot(sx, 1);
    const nx = sx / n, nz = 1 / n, x = blockXs[i];
    T.set([x, -hw, z[i], nx, 0, nz, x, hw, z[i], nx, 0, nz], i * 12);
    Fr.set([x, -hw, z[i], 0, -1, 0, x, -hw, BASE, 0, -1, 0], i * 12);
  }
  const x0 = blockXs[0];
  E.set([x0, -hw, z[0], -1, 0, 0, x0, -hw, BASE, -1, 0, 0, x0, hw, z[0], -1, 0, 0, x0, hw, BASE, -1, 0, 0]);

  gl.viewport(0, 0, gcv.width, gcv.height);
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  gl.useProgram(glp.prog);
  gl.uniformMatrix4fv(glp.uMVP, false, MVP);
  gl.uniform1f(glp.uCrest, Math.max(1, hs) * EXAG);
  gl.uniform1f(glp.uBase, BASE);
  gl.uniform1f(glp.uHalfW, hw);
  // Low sun along the direction of travel: a slope's brightness then says how
  // steep it is, so a group of big waves shows as a patch of strong contrast.
  gl.uniform3fv(glp.uSun, [-0.85, -0.15, 0.5]);
  gl.uniform3fv(glp.uView, EYE);
  const c = pal.gl;
  gl.uniform3fv(glp.uDeep, c.deep); gl.uniform3fv(glp.uShallow, c.shallow); gl.uniform3fv(glp.uSky, c.sky);
  gl.uniform3fv(glp.uBg, c.bg); gl.uniform3fv(glp.uSideTop, c.sideTop); gl.uniform3fv(glp.uSideBot, c.sideBot);
  gl.uniform1f(glp.uMode, 1);
  strip(glp.front, Fr, (NX + 1) * 2);
  strip(glp.end, E, 4);
  gl.uniform1f(glp.uMode, 0);
  strip(glp.top, T, (NX + 1) * 2);
}

/** The block, then the 2D marks over it: profile edge, Probe, scale. */
function drawSea() {
  sea.surface(blockXs, blockZ, K_MAX);
  for (let i = 0; i <= NX; i++) blockZ[i] *= EXAG;
  drawGl();

  const hw = WIDTH / 2;
  // The profile along the front edge, in the traces' glow, so the panels read
  // as one: it is the same kind of line as the trace below, laid in space.
  const edge = new Path2D();
  for (let i = 0; i <= NX; i += 2) {
    const [sx, sy] = project(blockXs[i], -hw, blockZ[i]);
    if (i === 0) edge.moveTo(sx, sy); else edge.lineTo(sx, sy);
  }
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.strokeStyle = rgba(pal.accent, 0.18); ctx.lineWidth = 4; ctx.stroke(edge);
  ctx.strokeStyle = pal.core; ctx.lineWidth = 1.2; ctx.stroke(edge);

  // The Probe: a pin on the front edge at x = 0.
  const zp = sea.eta(0) * EXAG;
  const [px, py] = project(0, -hw, zp);
  const [bx, by] = project(0, -hw, BASE);
  ctx.setLineDash([2, 4]);
  ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(bx, by); ctx.stroke();
  ctx.setLineDash([]);
  const glow = ctx.createRadialGradient(px, py, 2, px, py, 14);
  glow.addColorStop(0, rgba(pal.warm, 0.45)); glow.addColorStop(1, rgba(pal.warm, 0));
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(px, py, 14, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = rgba(pal.warm, 1);
  ctx.beginPath(); ctx.arc(px, py, 4.5, 0, Math.PI * 2); ctx.fill();

  // Scale: 500 m along the bottom front edge, and what heights are multiplied by.
  const [ax, ay] = project(-SPAN / 2 + 40, -hw, BASE);
  const [cx2, cy2] = project(-SPAN / 2 + 540, -hw, BASE);
  ctx.strokeStyle = pal.muted; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(ax, ay + 8); ctx.lineTo(cx2, cy2 + 8); ctx.stroke();
  for (const [qx, qy] of [[ax, ay], [cx2, cy2]]) { ctx.beginPath(); ctx.moveTo(qx, qy + 4); ctx.lineTo(qx, qy + 12); ctx.stroke(); }
  ctx.fillStyle = pal.muted; ctx.font = `600 10px ${FONT}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText('500 m', (ax + cx2) / 2, (ay + cy2) / 2 + 12);
  ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
  ctx.fillText(`heights ×${EXAG}  ·  ${SPEED}× speed  →  waves travel this way`, W - 14, lay.seaH - 8);
}

/* The trace: the Pile lab's, glow and all, on a small offscreen canvas. */
let goff = null, gctx = null, traceRef = 3;
function drawTrace(dt) {
  const { traceTop, traceH } = lay;
  const gh = traceH, gw = W;
  if (gh < 30 || traceCount < 2) return;
  const GDPR = Math.min(DPR, 1.25);
  if (!goff) { goff = document.createElement('canvas'); gctx = goff.getContext('2d'); }
  const dw = Math.max(1, Math.round(gw * GDPR)), dh = Math.max(1, Math.round(gh * GDPR));
  if (goff.width !== dw || goff.height !== dh) { goff.width = dw; goff.height = dh; }
  const g = gctx;
  g.setTransform(GDPR, 0, 0, GDPR, 0, 0);
  g.clearRect(0, 0, gw, gh);

  // Vertical scale in metres: room for Hs either way, growing at once if a
  // crest needs more, relaxing slowly.
  let peak = 0;
  for (let i = 0; i < traceCount; i++) peak = Math.max(peak, Math.abs(trace[i]));
  const target = Math.max(0.95 * hs, peak * 1.08);
  traceRef += (target - traceRef) * Math.min(1, dt * (target > traceRef ? 10 : 0.6));

  const mid = gh * 0.54, amp = gh * 0.40, pxs = gw / (TRACE_N - 1), n = traceCount;
  const xOf = (i) => gw - (n - 1 - i) * pxs;
  const at = (i) => trace[(traceHead - n + i + TRACE_N) % TRACE_N];
  const yOf = (v) => mid - (v / traceRef) * amp;

  // Ten-second marks.
  const oldest = traceTotal - n, every = 10 * TRACE_HZ;
  g.strokeStyle = rgba(pal.accent, 0.10); g.lineWidth = 1;
  g.beginPath();
  for (let a = Math.ceil(oldest / every) * every; a < traceTotal; a += every) {
    const x = Math.round(xOf(a - oldest)) + 0.5;
    g.moveTo(x, gh * 0.14); g.lineTo(x, gh * 0.94);
  }
  g.stroke();
  g.strokeStyle = rgba(pal.accent, 0.20);
  g.beginPath(); g.moveTo(0, Math.round(mid) + 0.5); g.lineTo(gw, Math.round(mid) + 0.5); g.stroke();

  const line = new Path2D();
  for (let i = 0; i < n; i++) { const y = yOf(at(i)); if (i === 0) line.moveTo(xOf(i), y); else line.lineTo(xOf(i), y); }
  const area = new Path2D(line);
  area.lineTo(xOf(n - 1), mid); area.lineTo(xOf(0), mid); area.closePath();
  const fg = g.createLinearGradient(0, mid - amp, 0, mid + amp);
  fg.addColorStop(0, rgba(pal.accent, 0.02)); fg.addColorStop(0.5, rgba(pal.accent, 0.28)); fg.addColorStop(1, rgba(pal.accent, 0.02));
  g.fillStyle = fg; g.fill(area);
  g.lineJoin = 'round'; g.lineCap = 'round';
  g.strokeStyle = rgba(pal.accent, 0.13); g.lineWidth = Math.max(4, gh * 0.04); g.stroke(line);
  g.strokeStyle = rgba(pal.accent, 0.6); g.lineWidth = Math.max(1.8, gh * 0.014); g.stroke(line);
  g.strokeStyle = pal.core; g.lineWidth = 1; g.stroke(line);

  // +-Hs/2: individual crests go past these all the time.
  g.setLineDash([5, 5]);
  g.strokeStyle = rgba(pal.warm, 0.55); g.lineWidth = 1;
  for (const v of [hs / 2, -hs / 2]) {
    const y = Math.round(yOf(v)) + 0.5;
    g.beginPath(); g.moveTo(0, y); g.lineTo(gw, y); g.stroke();
  }
  g.setLineDash([]);

  const fw = Math.min(gw * 0.17, 240);
  g.globalCompositeOperation = 'destination-out';
  const lg = g.createLinearGradient(0, 0, fw, 0);
  lg.addColorStop(0, 'rgba(0,0,0,1)'); lg.addColorStop(0.45, 'rgba(0,0,0,0.45)'); lg.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = lg; g.fillRect(0, 0, fw, gh);
  g.globalCompositeOperation = 'source-over';
  ctx.drawImage(goff, 0, traceTop, gw, gh);

  ctx.font = `600 10px ${FONT}`; ctx.textBaseline = 'top';
  ctx.fillStyle = pal.muted; ctx.textAlign = 'left';
  ctx.fillText('SURFACE AT THE PROBE  ·  LAST 3 MIN  ·  ' + SPEED + '× SPEED', 14, traceTop + 6);
  ctx.fillStyle = rgba(pal.warm, 0.85); ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
  ctx.fillText('+Hs/2', W - 10, Math.round(traceTop + yOf(hs / 2)) - 2);
  ctx.textBaseline = 'top';
  ctx.fillText('−Hs/2', W - 10, Math.round(traceTop + yOf(-hs / 2)) + 3);
}

/* The spectrum, with its peak as the handle. */
const F_MAX = 0.5;                                  // Hz shown
let specTopS = 10;                                  // current top of the S axis, m^2/Hz
let dragging = null;

function niceStep(range) {
  const raw = range / 4, p = 10 ** Math.floor(Math.log10(raw)), m = raw / p;
  return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p;
}

function specGeom() {
  const { specTop, specH } = lay;
  const left = 46, right = W - 18, top = specTop + 26, bottom = specTop + specH - 30;
  return { left, right, top, bottom, fx: (f) => left + (f / F_MAX) * (right - left), sy: (v) => bottom - (v / specTopS) * (bottom - top) };
}

function drawSpectrum(dt) {
  const G2 = specGeom();
  const { left, right, top, bottom, fx, sy } = G2;
  if (bottom - top < 30) return;
  const peak = spectrum(1 / tp, hs, tp, gamma);

  // The axis follows the curve: it eases towards putting the peak two thirds
  // of the way up, and never lets the peak leave the plot.
  const target = peak / 0.64;
  specTopS += (target - specTopS) * Math.min(1, dt * (dragging ? 1.2 : 3));
  specTopS = Math.max(specTopS, peak / 0.9);

  ctx.font = `500 10px ${FONT}`;
  ctx.strokeStyle = pal.rule; ctx.lineWidth = 1; ctx.fillStyle = pal.muted;
  // Frequency axis.
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.beginPath(); ctx.moveTo(left, Math.round(bottom) + 0.5); ctx.lineTo(right, Math.round(bottom) + 0.5); ctx.stroke();
  for (let f = 0; f <= F_MAX + 1e-9; f += 0.1) {
    const x = Math.round(fx(f)) + 0.5;
    ctx.beginPath(); ctx.moveTo(x, bottom); ctx.lineTo(x, bottom + 4); ctx.stroke();
    ctx.fillText(f.toFixed(1), x, bottom + 6);
  }
  ctx.textAlign = 'right';
  ctx.fillText('f  (Hz)', right, bottom + 17);
  // S axis, with nice ticks that relabel as it rescales.
  const step = niceStep(specTopS);
  ctx.textBaseline = 'middle';
  for (let v = step; v < specTopS; v += step) {
    const y = Math.round(sy(v)) + 0.5;
    ctx.strokeStyle = pal.rule;
    ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(right, y); ctx.globalAlpha = 0.45; ctx.stroke(); ctx.globalAlpha = 1;
    ctx.fillText(v >= 10 ? v.toFixed(0) : v >= 1 ? v.toFixed(1) : v.toPrecision(1), left - 6, y);
  }
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.font = `600 10px ${FONT}`;
  ctx.fillText('SPECTRUM  S(f)  m²/Hz', 14, lay.specTop + 8);

  // The breaking limit: where the peak would sit at the steepest sea for each
  // Tp. The handle cannot go above it.
  ctx.setLineDash([3, 4]);
  ctx.strokeStyle = rgba(pal.warm, 0.5); ctx.lineWidth = 1.2;
  ctx.beginPath();
  let started = false;
  for (let t = TP_RANGE[0]; t <= TP_RANGE[1] + 1e-9; t += 0.1) {
    const hl = Math.min(HS_RANGE[1], hsLimit(t));
    const v = spectrum(1 / t, hl, t, gamma);
    const x = fx(1 / t), y = sy(v);
    if (y < top - 2) { started = false; continue; }
    if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.setLineDash([]);

  // The curve.
  const line = new Path2D();
  const N = 360;
  for (let i = 0; i <= N; i++) {
    const f = (i / N) * F_MAX, y = sy(spectrum(f, hs, tp, gamma));
    if (i === 0) line.moveTo(fx(f), y); else line.lineTo(fx(f), y);
  }
  const area = new Path2D(line);
  area.lineTo(fx(F_MAX), bottom); area.lineTo(fx(0), bottom); area.closePath();
  const fg = ctx.createLinearGradient(0, top, 0, bottom);
  fg.addColorStop(0, rgba(pal.accent, 0.30)); fg.addColorStop(1, rgba(pal.accent, 0.04));
  ctx.fillStyle = fg; ctx.fill(area);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.strokeStyle = rgba(pal.accent, 0.14); ctx.lineWidth = 6; ctx.stroke(line);
  ctx.strokeStyle = rgba(pal.accent, 0.7); ctx.lineWidth = 2.2; ctx.stroke(line);
  ctx.strokeStyle = pal.core; ctx.lineWidth = 1; ctx.stroke(line);

  // The handle, and the sea state it sets.
  const hx = fx(1 / tp), hy = sy(peak);
  const r = dragging ? 10 : 8.5;
  const glow = ctx.createRadialGradient(hx, hy, 3, hx, hy, 24);
  glow.addColorStop(0, rgba(pal.accent, 0.3)); glow.addColorStop(1, rgba(pal.accent, 0));
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(hx, hy, 24, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = rgba(pal.accent, 1);
  ctx.beginPath(); ctx.arc(hx, hy, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath(); ctx.arc(hx - 2.4, hy - 2.6, 2.3, 0, Math.PI * 2); ctx.fill();

  const label = `Hs ${hs.toFixed(1)} m   Tp ${tp.toFixed(1)} s`;
  ctx.font = `650 12px ${FONT}`;
  const tw = ctx.measureText(label).width + 16, th = 22;
  let lx = hx + 16, ly = hy - th - 6;
  if (lx + tw > W - 6) lx = hx - 16 - tw;
  if (ly < lay.specTop + 22) ly = hy + 12;
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--glass');
  ctx.strokeStyle = rgba(pal.accent, 0.45); ctx.lineWidth = 1;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(lx, ly, tw, th, 7); else ctx.rect(lx, ly, tw, th);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = pal.ink; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(label, lx + 8, ly + th / 2 + 0.5);
}

function render(dt) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  drawSea();
  drawTrace(dt);
  drawSpectrum(dt);
}

/* ------------------------------------------------------------ the hand */

const hint = document.getElementById('hint');
const hintTimer = setTimeout(() => hint.classList.add('show'), 700);
function dismissHint() { clearTimeout(hintTimer); hint.classList.remove('show'); }

function local(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }

function nearHandle(p) {
  const { fx, sy, top, bottom } = specGeom();
  const hx = fx(1 / tp), hy = sy(spectrum(1 / tp, hs, tp, gamma));
  // Generous: the handle itself, or anywhere in the plot straight below it.
  return Math.hypot(p.x - hx, p.y - hy) < 30 || (Math.abs(p.x - hx) < 24 && p.y > hy && p.y < bottom + 4 && p.y > top - 10);
}

/**
 * Sideways sets Tp absolutely: the handle stays under the finger. Up and
 * down scale Hs multiplicatively, relative to where the drag began, because
 * the peak's height goes as Hs squared: no fixed axis could show 0.5 m and
 * 12 m at once, so the axis rescales underneath and the handle is drawn
 * wherever the peak ends up.
 */
cv.addEventListener('pointerdown', (e) => {
  if (dragging || !e.isPrimary) return;
  const p = local(e);
  if (!nearHandle(p)) return;
  dragging = { id: e.pointerId, y0: p.y, hs0: hs };
  cv.setPointerCapture(e.pointerId);
  cv.style.cursor = 'grabbing';
  dismissHint();
  e.preventDefault();
});
cv.addEventListener('pointermove', (e) => {
  const p = local(e);
  if (!dragging) { cv.style.cursor = nearHandle(p) ? 'grab' : 'default'; return; }
  if (e.pointerId !== dragging.id) return;
  const { fx, left, right } = specGeom();
  const f = Math.max(1e-3, ((Math.min(right, Math.max(left, p.x)) - left) / (right - left)) * F_MAX);
  const wanted = dragging.hs0 * Math.exp(-(p.y - dragging.y0) / 110);
  const next = clampSeaState(wanted, 1 / f);
  void fx;
  hs = next.hs; tp = next.tp;
  sea.setState(hs, tp, gamma);
});
function endDrag(e) {
  if (!dragging || e.pointerId !== dragging.id) return;
  dragging = null;
  cv.style.cursor = 'default';
}
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);
cv.addEventListener('lostpointercapture', endDrag);

/* ------------------------------------------------------------- controls */

const gammaIn = document.getElementById('gamma');
const gammaOut = document.getElementById('gammaOut');
function showGamma() { gammaOut.textContent = gamma.toFixed(1); }
gammaIn.addEventListener('input', () => {
  gamma = Number(gammaIn.value);
  sea.setState(hs, tp, gamma);
  showGamma();
  dismissHint();
});
document.getElementById('newsea').addEventListener('click', () => {
  sea.newSea();
  sea.setState(hs, tp, gamma);
});

/* ----------------------------------------------------------------- loop */

// Open mid-storm rather than on a flat calm: run the sea forward a few
// minutes so the trace is already full when the page appears.
for (let i = 0; i < TRACE_N; i++) {
  sea.advance(1 / TRACE_HZ);
  trace[traceHead] = sea.eta(0);
  traceHead = (traceHead + 1) % TRACE_N;
  traceCount = Math.min(TRACE_N, traceCount + 1);
  traceTotal++;
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  // Advance in trace-sized steps where one falls due, so every sample is taken
  // at its own moment rather than at whatever the frame rate happens to be.
  // dt is screen time (the axis easing uses it); the sea runs on sea time.
  let remaining = dt * SPEED;
  while (traceClock + remaining >= 1 / TRACE_HZ) {
    const step = 1 / TRACE_HZ - traceClock;
    sea.advance(step);
    remaining -= step;
    traceClock = 0;
    trace[traceHead] = sea.eta(0);
    traceHead = (traceHead + 1) % TRACE_N;
    traceCount = Math.min(TRACE_N, traceCount + 1);
    traceTotal++;
  }
  sea.advance(remaining);
  traceClock += remaining;
  render(dt);
  requestAnimationFrame(frame);
}

initGl();
new ResizeObserver(resize).observe(cv);
resize();
showGamma();
requestAnimationFrame(frame);
</script>
</body>
</html>
